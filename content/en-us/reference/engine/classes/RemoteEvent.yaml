name: PunchEvent
type: class
category: Scripting
memory_category: Instances
summary: -- Local Script: Player Punch
local player = game.Players.LocalPlayer
local mouse = player:GetMouse()
local remote = game.ReplicatedStorage:WaitForChild("PunchEvent")

-- Function to punch
local function onPunch()
    -- Send message to server with position of punch
    remote:FireServer(mouse.Hit.p)
end

-- Set up key press to punch (clicking)
mouse.Button1Down:Connect(onPunch)

